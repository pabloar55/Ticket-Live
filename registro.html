<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crear cuenta | Ticket Live</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/paginas/registro.css">
</head>
<body class="pagina-registro">
<main class="registro">
  <a href="index.html" class="logo"><span class="logo__icono"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><path d="M3 8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4z"/></svg></span>Ticket Live</a>
  <h1>Crear cuenta</h1>
  <p class="registro__intro">Únete a Ticket Live y asegura tus entradas oficiales con total garantía.</p>
  <form>
      <div class="campo"><label>Nombre de usuario o email</label><div class="entrada-icono"><span class="icono-izq"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg></span><input type="text" placeholder="Ej. carlos.perez@email.com"></div></div>
      <div class="campo"><label>Contraseña</label><div class="entrada-icono"><span class="icono-izq"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></span><input type="password" placeholder="Crea una contraseña segura"><span class="icono-der"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></span></div></div>
      <div class="campo"><label>Confirmar contraseña</label><div class="entrada-icono"><span class="icono-izq"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></span><input type="password" placeholder="Repite tu contraseña"><span class="icono-der"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></span></div></div>
    <button type="button" class="boton boton--bloque">Registrarse</button>
  </form>
  <p class="registro__pie">¿Ya tienes cuenta? <a href="#">Inicia sesión</a></p>
</main>
</body>
</html>
